name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build minified CSS
        run: uxcompose build
      - name: Tests
        run: python -m pytest
      - name: Live smoke (uvicorn)
        run: |
          python -m uvicorn app:asgi --host 127.0.0.1 --port 8099 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8099/ >/dev/null && break; sleep 1; done
          for p in / /shop /product/board /bag /wish /orders /css/output.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099$p")
            echo "$p $code"; test "$code" = 200
          done
